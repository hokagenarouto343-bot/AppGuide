<style>
:root {
  --bg-color: #eef8f2;
  --text-color: #123d2b;
  --card-bg: #ffffff;
  --header-bg: linear-gradient(135deg,#075a38,#16a866);
  --desc-color: #71867b;
  --label-bg: #dff4e8;
  --banner-bg: #fff3cd;
  --banner-text: #856404;
}

[data-theme="dark"] {
  --bg-color: #121815;
  --text-color: #e0ece5;
  --card-bg: #1c2420;
  --header-bg: linear-gradient(135deg,#053823,#0e6b41);
  --desc-color: #9cb0a5;
  --label-bg: #193829;
  --banner-bg: #2c2512;
  --banner-text: #ffe08a;
}

*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg-color);color:var(--text-color);transition:0.3s}
header{background:var(--header-bg);color:#fff;padding:25px 20px 35px;border-radius:0 0 32px 32px}
.logo-container{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:auto;flex-wrap:wrap;gap:10px}
.logo{font-size:28px;font-weight:800}.sub{margin-top:6px;color:#d9f8e8}
.controls{display:flex;gap:8px;align-items:center}
.theme-toggle, .lang-select{background:rgba(255,255,255,0.2);border:0;color:#fff;padding:8px 12px;border-radius:20px;cursor:pointer;font-size:14px}
.lang-select option{background:#075a38;color:#fff}
.dev-banner{background:var(--banner-bg);color:var(--banner-text);border:1px solid rgba(0,0,0,0.1);padding:12px;border-radius:12px;margin-bottom:18px;font-size:13px;text-align:center;font-weight:bold}
main{max-width:900px;margin:auto;padding:20px}h2{font-size:21px}
.search{width:100%;padding:15px;border:0;border-radius:15px;font-size:16px;margin-bottom:18px;background:var(--card-bg);color:var(--text-color)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.category{background:var(--card-bg);border:0;border-radius:18px;padding:18px;text-align:initial;box-shadow:0 4px 15px #0001;cursor:pointer;color:var(--text-color);width:100%}
.icon{font-size:30px}.title{font-weight:bold;font-size:16px;margin-top:8px}.small,.desc{font-size:12px;color:var(--desc-color);margin-top:6px}
.hidden{display:none}.back{border:0;background:#087f4e;color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;cursor:pointer}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.label{text-align:center;font-weight:bold;background:var(--label-bg);padding:11px;border-radius:13px;margin-bottom:10px;color:var(--text-color)}
.card{background:var(--card-bg);border-radius:15px;padding:14px;margin-bottom:10px;box-shadow:0 3px 12px #0001;color:var(--text-color)}
.app{font-weight:bold;font-size:16px}.desc{line-height:1.6}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.tag{display:inline-block;background:#edf7f1;color:#087f4e;border-radius:8px;padding:4px 8px;font-size:11px}
.cat-tag{display:inline-block;background:rgba(8,127,78,0.15);color:var(--text-color);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:bold}
.visit{display:block;text-align:center;text-decoration:none;background:#087f4e;color:white;border-radius:10px;padding:9px;font-size:13px}
.note{background:var(--card-bg);border-radius:14px;padding:12px;font-size:12px;color:var(--desc-color);margin-bottom:15px}
footer{text-align:center;color:var(--desc-color);font-size:12px;padding:25px}
@media(max-width:650px){.columns{grid-template-columns:1fr;gap:7px}.category{padding:15px}}
</style>
</head>

const homePage=document.getElementById("homePage"), detailsPage=document.getElementById("detailsPage");
const categoryList=document.getElementById("categoryList"), searchBox=document.getElementById("searchBox");
const sectionTitle=document.getElementById("sectionTitle"), freeList=document.getElementById("freeList"), paidList=document.getElementById("paidList");
const themeBtn=document.getElementById("themeBtn"), langSelect=document.getElementById("langSelect");

themeBtn.onclick=()=>{
  if(document.body.getAttribute("data-theme")==="dark"){
    document.body.removeAttribute("data-theme");
    themeBtn.textContent="🌙";
  }else{
    document.body.setAttribute("data-theme","dark");
    themeBtn.textContent="☀️";
  }
};

langSelect.onchange=(e)=>{
  currentLang = e.target.value;
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
  updateTexts();
  render(osCategories[currentLang]);
};

function updateTexts(){
  const t = uiTexts[currentLang];
  document.getElementById("subTitle").textContent = t.sub;
  document.getElementById("devBanner").textContent = t.banner;
  document.getElementById("selectOsTitle").textContent = t.selectOs;
  searchBox.placeholder = t.searchPh;
  document.getElementById("backButton").textContent = t.back;
  document.getElementById("noteText").textContent = t.note;
  document.getElementById("freeLabel").textContent = t.freeLabel;
  document.getElementById("paidLabel").textContent = t.paidLabel;
  document.getElementById("footerText").textContent = t.footer;
}

function render(list){
  categoryList.innerHTML="";
  list.forEach(c=>{
    const b=document.createElement("button");
    b.className="category";
    b.innerHTML=`<div class="icon">${c.icon}</div><div class="title">${c.title}</div><div class="small">${uiTexts[currentLang].appsCount}</div>`;
    b.onclick=()=>openCategory(list.indexOf(c));
    categoryList.appendChild(b);
  });
}

function cards(list){
  const t = uiTexts[currentLang];
  return list.map(x=>`<div class="card"><div class="app">${x[0]}</div><div class="desc">${x[1]}</div><div class="tags"><span class="tag">${t.official}</span><span class="cat-tag">📌 ${x[3]}</span></div><a class="visit" href="${x[2]}" target="_blank" rel="noopener">${t.visit}</a></div>`).join("");
}

function openCategory(i){
  const c=osCategories[currentLang][i];
  sectionTitle.textContent=c.icon+" "+c.title;
  freeList.innerHTML=cards(c.free);
  paidList.innerHTML=cards(c.paid);
  homePage.classList.add("hidden");
  detailsPage.classList.remove("hidden");
  scrollTo(0,0);
}

function goHome(){
  detailsPage.classList.add("hidden");
  homePage.classList.remove("hidden");
  scrollTo(0,0);
}

document.getElementById("backButton").onclick=goHome;
searchBox.oninput=()=>{
  const q=searchBox.value.trim().toLowerCase();
  render(osCategories[currentLang].filter(c=>c.title.toLowerCase().includes(q)));
};

updateTexts();
render(osCategories[currentLang]);
</script>
</body>
</html>
