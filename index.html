<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#eef8f2;color:#123d2b}
header{background:linear-gradient(135deg,#075a38,#16a866);color:#fff;padding:30px 20px 38px;border-radius:0 0 32px 32px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.category{background:#fff;border:0;border-radius:18px;padding:18px;text-align:right;box-shadow:0 4px 15px #0001;cursor:pointer}.icon{font-size:30px}.title{font-weight:bold;font-size:16px;margin-top:8px}.small,.desc{font-size:12px;color:#71867b;margin-top:6px}

.card{background:#fff;border-radius:15px;padding:14px;margin-bottom:10px;box-shadow:0 3px 12px #0001}.app{font-weight:bold;font-size:16px}.desc{line-height:1.6}.tag{display:inline-block;background:#edf7f1;color:#087f4e;border-radius:8px;padding:5px 8px;font-size:11px;margin-bottom:10px}
.visit{display:block;text-align:center;text-decoration:none;background:#087f4e;color:white;border-radius:10px;padding:9px;font-size:13px}
.note{background:#fff;border-radius:14px;padding:12px;font-size:12px;color:#60786b;margin-bottom:15px}
footer{text-align:center;color:#769184;font-size:12px;padding:25px}
@media(max-width:650px){.columns{grid-template-columns:1fr;gap:7px}.category{padding:15px}}
</style>

const homePage=document.getElementById("homePage"), detailsPage=document.getElementById("detailsPage");
const categoryList=document.getElementById("categoryList"), searchBox=document.getElementById("searchBox");
const sectionTitle=document.getElementById("sectionTitle"), freeList=document.getElementById("freeList"), paidList=document.getElementById("paidList");

function render(list){
  categoryList.innerHTML="";
  list.forEach(c=>{
    const b=document.createElement("button");
    b.className="category";
    b.innerHTML=`<div class="icon">${c.icon}</div><div class="title">${c.title}</div><div class="small">20 تطبيقًا محققًا</div>`;
    b.onclick=()=>openCategory(categories.indexOf(c));
    categoryList.appendChild(b);
  });
}

function cards(list){
  return list.map(x=>`<div class="card"><div class="app">${x[0]}</div><div class="desc">${x[1]}</div><span class="tag">رابط رسمي</span><a class="visit" href="${x[2]}" target="_blank" rel="noopener">زيارة الموقع الرسمي ↗</a></div>`).join("");
}

function openCategory(i){
  const c=categories[i];
  sectionTitle.textContent=c.icon+" "+c.title;
  freeList.innerHTML=cards(c.free);
  paidList.innerHTML=cards(c.paid);
  homePage.classList.add("hidden");
  detailsPage.classList.remove("hidden");
  scrollTo(0,0);
}

function goHome(){
  detailsPage.classList.add("hidden");
  homePage.classList.remove("hidden");
  scrollTo(0,0);
}

document.getElementById("backButton").onclick=goHome;
searchBox.oninput=()=>{
  const q=searchBox.value.trim().toLowerCase();
  render(categories.filter(c=>c.title.toLowerCase().includes(q)));
};
render(categories);
